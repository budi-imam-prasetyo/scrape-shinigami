name: Refresh manhwa.json

on:
  schedule:
    # 18:00 UTC = 01:00 WIB setiap hari
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-manhwa
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run scraper
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          python main.py --output manhwa.json --max-retries 5 --backoff-base 3.0 --retry-forbidden 2>&1 | tee "$RUNNER_TEMP/scraper.log"

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-diagnostics
          path: ${{ runner.temp }}/scraper.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate JSON
        run: python -m json.tool manhwa.json > /dev/null

      - name: Commit and push if changed
        # Dispatch branch digunakan untuk uji; jangan terbitkan kode branch ke main.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manhwa.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily refresh manhwa.json"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
